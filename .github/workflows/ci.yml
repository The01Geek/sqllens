name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Default types (opened, synchronize, reopened) are NOT enough for our
    # bot PRs. Automation (claude-implement / devflow-review-and-fix /
    # WikiWizard) opens a PR as a draft, pushes its fix + docs commits using
    # the default GITHUB_TOKEN — which GitHub's recursion guard suppresses, so
    # NO `synchronize` event fires for those commits — then toggles the PR to
    # ready-for-review. Listening only to the default types meant CI never ran
    # on the bot's HEAD commit; because `Lint + unit + transport (py3.12)` is a
    # REQUIRED status check, the PR wedged at "Expected — waiting for status"
    # forever. Adding `ready_for_review` makes CI fire on that toggle and pick
    # up the current HEAD — the same event the Devflow Review / Sync PR Status
    # / WikiWizard workflows already key off to catch these bot PRs. We do NOT
    # add `pull_request_target` here (unlike devflow-review.yml): this job runs
    # arbitrary PR code (`pip install -e .`, pytest), and doing that under
    # pull_request_target would expose repo secrets/token to untrusted code.
    types: [opened, synchronize, reopened, ready_for_review]
  # GitHub Merge Queue dispatches a `merge_group` event for each queued PR
  # against a synthesized post-merge tree (gh-readonly-queue/main/...). Without
  # this trigger the required checks never fire on the queue's merge-group refs
  # and PRs stall in the queue indefinitely.
  merge_group:

permissions:
  contents: read

jobs:
  unit:
    name: Lint + unit + transport (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -c requirements.txt -c docker/requirements-drivers.txt -e ".[dev,all]"
      - run: pip check
      - name: Validate release fragments
        run: python scripts/changelog.py check
      - name: Guard generated release files on pull requests
        if: github.event_name == 'pull_request'
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGELOG_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "$CHANGELOG_BASE"
          python scripts/changelog.py policy --base "$CHANGELOG_BASE" --branch "$CHANGELOG_BRANCH"
      - run: ruff check .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.python-version == '3.12'
        with:
          node-version: "24"
      - name: Test security audit workflow expressions
        if: matrix.python-version == '3.12'
        working-directory: .github/tests/security-audit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      # tests/conftest.py ignores tests/connectors/ — those tests need
      # real DB service containers and run in the dedicated job below.
      - run: pytest -q

  connectors:
    name: Connector tests (Postgres + MySQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sqllens
          POSTGRES_PASSWORD: sqllens
          POSTGRES_DB: sqllens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqllens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: sqllens
          MYSQL_DATABASE: sqllens
          MYSQL_USER: sqllens
          MYSQL_PASSWORD: sqllens
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -psqllens --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      SQLLENS_TEST_POSTGRES_URL: postgresql://sqllens:sqllens@127.0.0.1:5432/sqllens
      SQLLENS_TEST_MYSQL_URL: mysql+pymysql://sqllens:sqllens@127.0.0.1:3306/sqllens

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -c requirements.txt -c docker/requirements-drivers.txt -e ".[dev,all]"
      - run: pip check

      # Wait for both DBs to accept ``SELECT 1``. Service-container health
      # checks usually catch this, but MySQL on first boot is slow.
      - name: Wait for databases
        run: |
          ready=0
          for i in $(seq 1 30); do
            if python <<'PY'
          import psycopg2, pymysql, os
          psycopg2.connect(os.environ['SQLLENS_TEST_POSTGRES_URL']).close()
          pymysql.connect(host='127.0.0.1', user='sqllens', password='sqllens', database='sqllens').close()
          print('ready')
          PY
            then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::Postgres/MySQL service containers never accepted connections after 30 attempts (~60s)"
            exit 1
          fi

      # MySQL 8.0 enables binary logging, so a user without SUPER cannot create
      # the stored function the RLS connector test needs (errors 1418/1419).
      - name: Allow the test user to create MySQL stored functions
        run: python -c "import pymysql; c = pymysql.connect(host='127.0.0.1', user='root', password='sqllens'); c.cursor().execute('SET GLOBAL log_bin_trust_function_creators = 1'); c.close()"

      - run: pytest -q tests/connectors -v

  # Auto-request a PRFlow review once both CI jobs above are green, by posting a
  # standalone `/prflow:review` comment that devflow.yml's `command` job picks
  # up, the same path a hand-typed comment takes. The vendored helper makes every
  # post/skip/dedupe decision; this job supplies only the five eligibility
  # clauses and the credential. See PRFlow's "Request a Review Automatically on
  # Green CI" guide.
  #
  # `needs:` with no `if: always()` gates on every CI job succeeding, so a red
  # run never requests a review. The job is skipped until the repository has a
  # DEVFLOW_APP_ID variable and DEVFLOW_APP_PRIVATE_KEY secret, and the App's
  # bot login must be in prflow.allowed_bots on main for the comment to start a
  # review.
  request-review:
    needs: [unit, connectors]
    # Keep this workflow on `pull_request`; never `pull_request_target`, which
    # would expose secrets to fork runs. Non-draft, same-repository head (forks
    # never request), not dependabot, and an App configured. Push and
    # merge_group runs are skipped.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && vars.DEVFLOW_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .prflow/config.json
            .github/actions/read-project-config
            .github/actions/vendor-plugin
            .prflow/vendor/prflow/scripts
            .prflow/vendor/prflow/lib
          sparse-checkout-cone-mode: false
      # Thin install: the plugin tree is fetched at run time at the pinned
      # prflow_version from .prflow/config.json.
      - id: cfg
        uses: ./.github/actions/read-project-config
      - uses: ./.github/actions/vendor-plugin
        with:
          ref: ${{ fromJSON(steps.cfg.outputs.json).prflow_version }}
      - name: Mint downscoped review-trigger token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Post review-trigger comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          # Keys the helper's per-SHA dedupe marker: a re-run over the same head
          # posts nothing, a new head requests again.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_AUTHOR: ${{ steps.app-token.outputs.app-slug }}
        run: |
          HELPER=.prflow/vendor/prflow/scripts/post-ci-review-trigger.sh
          # A missing helper is a named warning, never an error (must not redden CI).
          if [ ! -x "$HELPER" ]; then
            echo "::warning::auto-review: helper $HELPER is absent or not executable (was the plugin vendored at the pinned prflow_version?); no review requested for PR #$PR."
            exit 0
          fi
          "$HELPER"
