name: Dependency audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit (advisory, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit recorded runtime closure
        id: audit
        continue-on-error: true
        # Only Chroma HTTP-server advisories are excluded: this application
        # uses embedded PersistentClient and does not expose Chroma routes.
        # Full rationale and revisit conditions: docs/internal/operations/dependency-audit.md.
        run: >-
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
      - name: Surface advisory failure
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit needs review; inspect the audit step for findings or scanner errors.'
