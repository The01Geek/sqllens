name: Weekly Security Audit

# This public workflow sends only a public commit SHA and lookback window.
# Analysis and findings belong in the configured private repository.
on:
  schedule:
    - cron: '0 15 * * 6'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Recent-change emphasis, integer 1-90'
        required: false
        default: '7'

permissions:
  contents: read

concurrency:
  group: security-audit-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && github.ref_name || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select the public default-branch commit
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dispatch to the private audit host
        env:
          SECURITY_AUDIT_REPOSITORY: ${{ secrets.SECURITY_AUDIT_REPOSITORY }}
          SECURITY_AUDIT_DISPATCH_TOKEN: ${{ secrets.SECURITY_AUDIT_DISPATCH_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        run: python3 .github/scripts/security_advisories.py dispatch
